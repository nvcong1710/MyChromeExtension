<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="tailwind.css" />
  </head>
  <body class="w-[340px] bg-white font-sans text-slate-800 dark:bg-slate-900 dark:text-slate-100">
    <!-- Header -->
    <header class="flex items-center gap-3 bg-gradient-to-br from-brand-500 to-brand-700 px-4 py-3 text-white">
      <img src="icon48.png" alt="" class="h-8 w-8 rounded-lg" />
      <div class="min-w-0">
        <div class="text-[15px] font-bold leading-tight">Vimi Bilingual</div>
        <div class="text-[11px] text-white/80">Read bilingual · learn vocabulary</div>
      </div>
      <button id="opts" title="Settings"
        class="ml-auto inline-flex shrink-0 items-center gap-1.5 rounded-lg bg-white/15 px-2.5 py-1.5 text-xs font-semibold text-white transition hover:bg-white/25">
        ⚙️ <span>Settings</span>
      </button>
    </header>

    <main class="flex flex-col gap-3 p-3.5">
      <!-- Translate toggle -->
      <section class="card flex items-center justify-between p-3.5">
        <div class="min-w-0">
          <div class="text-sm font-semibold">Translate this page</div>
          <div id="host" class="mt-0.5 truncate text-xs text-slate-500 dark:text-slate-400">—</div>
        </div>
        <label class="relative inline-flex shrink-0 cursor-pointer items-center">
          <input type="checkbox" id="power" class="peer sr-only" />
          <div class="h-6 w-11 rounded-full bg-slate-300 transition peer-checked:bg-brand-600 peer-focus-visible:ring-2 peer-focus-visible:ring-brand-500/40 dark:bg-slate-600"></div>
          <div class="pointer-events-none absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></div>
        </label>
      </section>

      <!-- Language pair -->
      <section class="card flex items-end gap-2 p-3.5">
        <label class="min-w-0 flex-1">
          <span class="label">From</span>
          <select id="src" class="input"></select>
        </label>
        <button id="swap" title="Swap languages" aria-label="Swap languages"
          class="mb-0.5 h-9 w-9 shrink-0 rounded-lg border border-slate-200 bg-white text-brand-600 transition hover:bg-brand-50 dark:border-slate-600 dark:bg-slate-700 dark:hover:bg-slate-600">⇄</button>
        <label class="min-w-0 flex-1">
          <span class="label">To</span>
          <select id="tgt" class="input"></select>
        </label>
      </section>

      <!-- Mascot toggle -->
      <section class="card flex items-center justify-between p-3.5">
        <div class="min-w-0">
          <div class="text-sm font-semibold">Show Vimi mascot</div>
          <div class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">The companion on your pages</div>
        </div>
        <label class="relative inline-flex shrink-0 cursor-pointer items-center">
          <input type="checkbox" id="mascot" class="peer sr-only" />
          <div class="h-6 w-11 rounded-full bg-slate-300 transition peer-checked:bg-brand-600 peer-focus-visible:ring-2 peer-focus-visible:ring-brand-500/40 dark:bg-slate-600"></div>
          <div class="pointer-events-none absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></div>
        </label>
      </section>

      <!-- Learning stats -->
      <section class="card flex flex-col gap-3 p-3.5">
        <div class="flex items-center justify-center gap-1.5 text-sm font-bold text-orange-500">
          🔥 <span id="streakNum">0</span>
          <span class="font-semibold text-slate-500 dark:text-slate-400">day streak</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div class="rounded-xl border border-slate-200 bg-white py-2 text-center dark:border-slate-700 dark:bg-slate-900/40">
            <div id="dueNum" class="text-lg font-bold leading-none text-brand-600">0</div>
            <div class="mt-1 text-[10.5px] text-slate-500 dark:text-slate-400">Due now</div>
          </div>
          <div class="rounded-xl border border-slate-200 bg-white py-2 text-center dark:border-slate-700 dark:bg-slate-900/40">
            <div id="goalNum" class="text-lg font-bold leading-none text-brand-600">0/0</div>
            <div class="mt-1 text-[10.5px] text-slate-500 dark:text-slate-400">Today's goal</div>
          </div>
          <div class="rounded-xl border border-slate-200 bg-white py-2 text-center dark:border-slate-700 dark:bg-slate-900/40">
            <div id="totalNum" class="text-lg font-bold leading-none text-brand-600">0</div>
            <div class="mt-1 text-[10.5px] text-slate-500 dark:text-slate-400">Total words</div>
          </div>
        </div>
        <div class="flex gap-2">
          <button id="review" class="btn btn-primary relative flex-1">Review</button>
          <button id="test" class="btn relative flex-1">Test</button>
        </div>
        <div id="testNote" class="min-h-[14px] text-center text-[11.5px] text-slate-500 dark:text-slate-400"></div>
      </section>

      <p class="px-1 text-[11.5px] leading-snug text-slate-500 dark:text-slate-400">
        Tip: highlight any word on a page to save it to your vocabulary.
      </p>
    </main>

    <footer class="flex items-center gap-1.5 border-t border-slate-200 px-3.5 py-2.5 text-xs text-slate-500 dark:border-slate-700 dark:text-slate-400">
      <kbd class="rounded border border-b-2 border-slate-300 bg-slate-50 px-1.5 text-[11px] text-slate-700 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200">Alt</kbd>
      +
      <kbd class="rounded border border-b-2 border-slate-300 bg-slate-50 px-1.5 text-[11px] text-slate-700 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200">T</kbd>
      <span class="flex-1">to toggle translation</span>
    </footer>

    <script src="store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
