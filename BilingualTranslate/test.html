<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vimi Bilingual — Test</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="tailwind.css" />
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-800 dark:bg-slate-900 dark:text-slate-100">
    <header class="flex items-center gap-3 bg-gradient-to-br from-brand-500 to-brand-700 px-6 py-4 text-white">
      <img src="icon48.png" alt="" class="h-9 w-9 rounded-lg" />
      <div>
        <div class="text-base font-bold leading-tight">Weekly Test</div>
        <div class="text-xs text-white/80" id="sub">Review what you learned</div>
      </div>
    </header>

    <div class="sticky top-0 z-10 hidden bg-slate-50/90 px-6 py-2 backdrop-blur dark:bg-slate-900/90" id="progressBar">
      <div class="mx-auto max-w-2xl">
        <div class="mb-1 flex justify-between text-xs text-slate-500 dark:text-slate-400">
          <span id="progressText">0 / 0 answered</span>
        </div>
        <div class="h-1.5 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700">
          <div id="progressFill" class="h-full w-0 rounded-full bg-brand-600 transition-[width] duration-200"></div>
        </div>
      </div>
    </div>

    <div class="mx-auto max-w-2xl px-5 py-6" id="body"></div>

    <script src="store.js"></script>
    <script src="test.js"></script>
  </body>
</html>
