<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vimi Bilingual Video Subtitles Test</title>
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="subtitles.css">
  <link rel="stylesheet" href="translation-card.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p.desc {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 450px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .controls-panel {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #2563eb;
    }
    .info {
      font-size: 12px;
      color: #94a3b8;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Vimi Video Bilingual Subtitles Test Page</h1>
    <p class="desc">
      Testing HTML5 standard <code>&lt;track&gt;</code> caption capture, time-synchronized cue detection,
      real-time bilingual rendering, drag-and-drop subtitle repositioning, and click-to-save vocabulary!
    </p>

    <div class="video-wrapper" id="playerWrapper">
      <video id="testVideo" controls playsinline loop muted src="sample.webm">
        <track id="subTrack" src="test-subtitles.vtt" kind="subtitles" srclang="en" label="English" default>
      </video>
    </div>

    <div class="controls-panel">
      <button id="btnPlay">▶ Play / Pause</button>
      <button id="btnCue1">⏮ Welcome Cue (1s)</button>
      <button id="btnCue2">⏯ Explore Cue (3s)</button>
      <button id="btnCue3">⏩ Algorithm Cue (5s)</button>
      <span class="info" id="timeInfo">0.0s</span>
    </div>
  </div>

  <!-- Mock Chrome runtime & storage if running directly via file:// or http:// -->
  <script>
    if (!window.chrome) window.chrome = {};
    if (!chrome.storage) {
      const mockStorage = {
        fufuConfig: {
          src: "en",
          tgt: "vi",
          videoSubEnabled: true,
          videoSubLayout: "bilingual",
          videoSubSize: "md",
          videoSubAutoPause: false,
          videoSubHighlightVocab: true,
        },
        fufuVocab: [
          { term: "algorithm", translation: "thuật toán" },
          { term: "vocabulary", translation: "từ vựng" }
        ]
      };
      chrome.storage = {
        local: {
          get: async (key) => {
            if (typeof key === "string") return { [key]: mockStorage[key] };
            if (Array.isArray(key)) {
              const res = {};
              key.forEach(k => res[k] = mockStorage[k]);
              return res;
            }
            return mockStorage;
          },
          set: async (obj) => {
            Object.assign(mockStorage, obj);
          },
          remove: async (keys) => {
            const arr = Array.isArray(keys) ? keys : [keys];
            arr.forEach(k => delete mockStorage[k]);
          }
        },
        onChanged: { addListener: () => {} }
      };
    }
    if (!chrome.runtime) {
      chrome.runtime = {
        onMessage: { addListener: () => {} },
        sendMessage: async (msg) => {
          if (msg.type === "FUFU_TRANSLATE") {
            const map = {
              "Welcome to this computer science lecture.": "Chào mừng bạn đến với bài giảng khoa học máy tính này.",
              "Today we explore algorithms and artificial intelligence.": "Hôm nay chúng ta tìm hiểu thuật toán và trí tuệ nhân tạo.",
              "An algorithm solves complex problems efficiently.": "Một thuật toán giải quyết các vấn đề phức tạp một cách hiệu quả.",
              "algorithm": "thuật toán",
              "vocabulary": "từ vựng",
              "computer": "máy tính",
              "science": "khoa học"
            };
            return { translation: map[msg.text] || `[Dịch: ${msg.text}]` };
          }
          return {};
        },
        getURL: (p) => p
      };
    }
  </script>

  <!-- Load Extension Modules -->
  <script src="store.js"></script>
  <script src="translation-card.js"></script>
  <script src="subtitles.js"></script>

  <script>
    const video = document.getElementById("testVideo");
    const timeInfo = document.getElementById("timeInfo");

    video.addEventListener("timeupdate", () => {
      timeInfo.textContent = video.currentTime.toFixed(1) + "s / " + (video.duration || 0).toFixed(1) + "s";
    });

    document.getElementById("btnPlay").onclick = () => {
      if (video.paused) video.play();
      else video.pause();
    };
    document.getElementById("btnCue1").onclick = () => {
      video.currentTime = 1.0;
      video.play();
    };
    document.getElementById("btnCue2").onclick = () => {
      video.currentTime = 3.0;
      video.play();
    };
    document.getElementById("btnCue3").onclick = () => {
      video.currentTime = 5.0;
      video.play();
    };
  </script>
</body>
</html>
