
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>English Note — Options</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; padding: 16px; max-width: 800px; margin: 0 auto; }
      h1 { font-size: 20px; }
      textarea { width: 100%; height: 260px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .row { display: flex; gap: 8px; margin: 8px 0; }
      button { padding: 8px 12px; }
      .muted { color: #555; font-size: 12px; }
      input[type="text"] { padding: 6px 8px; width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>English Note — Data (JSON)</h1>
    <p class="muted">Dữ liệu là một mảng JSON gồm các đối tượng: <code>{ "en": "hello", "vi": "xin chào" }</code>.</p>
    <div class="row">
      <button id="btnLoad">Load</button>
      <button id="btnSave">Save</button>
      <button id="btnExport">Export .json</button>
      <input type="file" id="fileInput" accept="application/json" />
      <button id="btnImport">Import from file</button>
    </div>
    <textarea id="jsonArea" placeholder='[{"en":"hello","vi":"xin chào"}]'></textarea>
    <h2>Quick add</h2>
    <div class="row">
      <input type="text" id="en" placeholder="English" />
      <input type="text" id="vi" placeholder="Vietnamese" />
      <button id="btnAdd">Add</button>
    </div>
    <p id="status" class="muted"></p>
    <script src="options.js"></script>
  </body>
</html>
