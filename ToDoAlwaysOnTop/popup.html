<!DOCTYPE html>
<html>

<head>
    <title>To-Do App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h3>To-Do List</h3>
    <div id="todo-container">
        <input type="text" id="new-task" placeholder="Enter new task">
        <button id="add-task">Add Task</button>
        <ul id="task-list"></ul>
    </div>
    <h4>Settings</h4>
    <label>
        <input type="radio" name="on-top-mode" value="always" checked> Always on Top
    </label>
    <br>
    <label>
        <input type="radio" name="on-top-mode" value="timer"> On Top After 1 Minute
    </label>
    <script src="popup.js"></script>
</body>

</html>
