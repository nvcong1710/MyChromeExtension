<!DOCTYPE html>
<html>
  <head>
    <title>Auto Scroll</title>
    <style>
      body {
        width: 200px;
        padding: 10px;
      }
      input {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Auto Scroll</h1>
    <input
      type="number"
      id="scrollValue"
      placeholder="Enter scroll value (px)"
    />
    <button id="startScroll">Start Scrolling</button>
    <button id="stopScroll">Stop Scrolling</button>
    <script src="popup.js"></script>
  </body>
</html>
